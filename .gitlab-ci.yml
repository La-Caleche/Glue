image: eclipse-temurin:21-jdk

variables:
  # Loom remappers share the build JVM; bound concurrency and override the 1 GiB local heap.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.parallel=false
  # Keep Gradle's dependency/wrapper cache inside the project dir so GitLab can cache it.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  cache:
    key: gradle-home
    paths:
      - .gradle-home/caches/modules-2
      - .gradle-home/wrapper

stages:
  - check
  - publish

check:
  stage: check
  script:
    # check covers the tests and the static analysis; remapJar also validates resource expansion and
    # jar packaging.
    - ./gradlew check remapJar
  rules:
    - if: $CI_COMMIT_BRANCH

publish:
  stage: publish
  script:
    - ./gradlew test
        :publish
        :glue-gametest:publish
        :glue-showcase:remapJar
  artifacts:
    paths:
      - build/libs/*.jar
  rules:
    - if: $CI_COMMIT_TAG
