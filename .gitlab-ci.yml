image: eclipse-temurin:21-jdk

variables:
  # Loom remappers share the build JVM; bound concurrency and override the 1 GiB local heap.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.parallel=false
  # Keep Gradle's dependency/wrapper cache inside the project dir so GitLab can cache it.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  cache:
    key: gradle-home
    paths:
      - .gradle-home/caches/modules-2
      - .gradle-home/wrapper

stages:
  - frontend
  - check
  - publish

showcase-web:
  stage: frontend
  image: node:24-bookworm
  cache:
    key:
      files:
        - glue-showcase/web/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  script:
    - npm install --global pnpm@11.5.2
    - pnpm --dir glue-showcase/web install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm --dir glue-showcase/web build
  artifacts:
    paths:
      - glue-showcase/build/generated/webResources/
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

check:
  stage: check
  needs:
    - job: showcase-web
      artifacts: true
  script:
    # check covers the tests and the static analysis; remapJar also validates resource expansion and
    # jar packaging. The frontend job already built the resource input, so this image needs no Node.
    - ./gradlew check remapJar -x :glue-showcase:installWeb -x :glue-showcase:buildWeb
  rules:
    - if: $CI_COMMIT_BRANCH

publish:
  stage: publish
  needs:
    - job: showcase-web
      artifacts: true
  script:
    - ./gradlew test
        :glue-core:publish
        :glue-render:publish
        :glue-lumos:publish
        :glue-lumos-client:publish
        :glue-web:publish
        :glue-gametest:publish
        :glue-dist:remapJar
        :glue-showcase:remapJar
        -x :glue-showcase:installWeb
        -x :glue-showcase:buildWeb
  artifacts:
    paths:
      - build/libs/*.jar
  rules:
    - if: $CI_COMMIT_TAG
