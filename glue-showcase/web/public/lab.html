<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Input lab</title>
    <link rel="stylesheet" href="vanilla.css">
    <style>
        body {
            display: grid;
            place-items: center;
            background: rgb(13 31 30 / 0.45);
        }

        .lab {
            width: min(340px, calc(100vw - 16px));
            padding: 10px 12px;
            background-color: var(--slate);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .fps {
            color: var(--xp);
            font-size: 11px;
            font-weight: 600;
        }

        form {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            align-items: center;
            gap: 5px 8px;
        }

        label {
            color: var(--bone-dim);
        }

        output {
            font-size: 11px;
            font-weight: 600;
        }

        .range {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="range"] {
            flex: 1;
            height: 12px;
            margin: 0;
            accent-color: var(--brass);
            cursor: pointer;
        }

        select {
            height: 15px;
            padding: 0 4px;
            border: 1px solid var(--slate-line);
            border-radius: 2px;
            background: var(--slate-deep);
            cursor: pointer;
        }

        .track {
            position: relative;
            height: 10px;
            margin: 8px 0 6px;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--slate-deep), var(--slate-line), var(--slate-deep));
        }

        .orb {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--effect, var(--air));
            box-shadow: 0 0 6px var(--effect, var(--air));
        }

        .orb.is-moving {
            animation: sweep 1.6s ease-in-out infinite alternate;
        }

        @keyframes sweep {
            to {
                left: calc(100% - 9px);
            }
        }

        footer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 3px 8px;
        }
    </style>
</head>
<body data-renderer="vanilla">
<main class="lab panel">
    <header>
        <div>
            <h1>Input lab</h1>
            <p class="muted">Plain HTML and JavaScript: native input, Java actions and live game state.</p>
        </div>
        <span class="fps"><span id="fps">0</span> fps</span>
    </header>
    <hr class="rule">
    <form id="controls" autocomplete="off">
        <label for="callsign">Callsign</label>
        <input class="field" id="callsign" value="Explorer" spellcheck="false">
        <button class="button needs-bridge" id="greet" type="button">Greet</button>

        <label for="count">Clicks</label>
        <output id="count">0</output>
        <button class="button is-primary needs-bridge" id="increment" type="button">Count a click</button>

        <label for="power">Power</label>
        <div class="range">
            <input id="power" type="range" min="0" max="100" value="65">
        </div>
        <output id="power-value">65%</output>

        <label for="effect">Effect</label>
        <select id="effect">
            <option>Aurora</option>
            <option>Ocean</option>
            <option>Ember</option>
        </select>
        <button class="button" id="animate" type="button">Animate</button>
    </form>
    <div class="track" aria-hidden="true"><div class="orb" id="orb"></div></div>
    <footer>
        <span id="position" class="muted">Waiting for the game</span>
        <button class="button needs-bridge" id="refuse" type="button">Try a refused action</button>
        <span class="status" id="status"></span>
        <span class="muted" id="event">No event yet</span>
    </footer>
</main>
<script type="module">
    import { $, call, on, ready, showStatus, state } from './vanilla.js';

    const effects = { Aurora: 'var(--xp)', Ocean: 'var(--air)', Ember: 'var(--food)' };
    const lab = { count: 0, fps: 0, connected: false, greeting: '', refusal: '', lastEvent: null };
    const status = $('#status');

    ready.then(() => { lab.connected = true; }, error => showStatus(status, `Not connected: ${error.message}`, true));

    state('game', game => {
        if (!game) return;
        lab.fps = game.fps;
        $('#fps').textContent = game.fps;
        $('#position').textContent = `Position ${game.position}`;
    });

    on('lab.ping', data => {
        lab.lastEvent = data;
        $('#event').textContent = `Event: ${data.message}`;
    });

    $('#increment').addEventListener('click', async () => {
        lab.count = await call('lab.increment');
        $('#count').textContent = lab.count;
    });

    $('#greet').addEventListener('click', async () => {
        try {
            lab.greeting = await call('lab.greet', { name: $('#callsign').value });
            showStatus(status, lab.greeting);
        } catch (error) {
            showStatus(status, error.message, true);
        }
    });

    $('#refuse').addEventListener('click', async () => {
        try {
            await call('lab.refuse');
        } catch (error) {
            lab.refusal = error.message;
            showStatus(status, `Refused with code ${error.code}: ${error.message}`, true);
        }
    });

    $('#power').addEventListener('input', event => {
        $('#power-value').textContent = `${event.target.value}%`;
    });

    $('#effect').addEventListener('change', event => {
        $('#orb').style.setProperty('--effect', effects[event.target.value]);
    });

    $('#animate').addEventListener('click', event => {
        const moving = $('#orb').classList.toggle('is-moving');
        event.target.textContent = moving ? 'Stop' : 'Animate';
    });

    window.labSnapshot = () => ({
        ...lab,
        renderer: document.body.dataset.renderer,
        name: $('#callsign').value,
        power: Number($('#power').value),
        effect: $('#effect').value,
        animating: $('#orb').classList.contains('is-moving'),
        devicePixelRatio,
        viewport: { width: innerWidth, height: innerHeight },
    });
</script>
</body>
</html>
